<style>
:root {

  --bg-a: #eff6ff; --bg-b: #ffffff; --bg-c: #eef2ff;
  --surface: #ffffff; --surface-2: #f3f7ff;
  --text: #0f1b3d; --muted: #475a8a; --line: #bfdbfe;
  --brand: #1d4ed8; --brand-hover: #1e40af; --on-brand: #ffffff; --tint: #eff6ff;
  --shadow: 0 10px 30px -12px rgba(30,58,138,.28);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #0a1129; --bg-b: #0d1633; --bg-c: #111a45;
    --surface: #131d45; --surface-2: #182352;
    --text: #e7edff; --muted: #a3b4e3; --line: #283a78;
    --brand: #6ea8ff; --brand-hover: #93c0ff; --on-brand: #0a1129; --tint: #182352;
    --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --bg-a: #0a1129; --bg-b: #0d1633; --bg-c: #111a45;
  --surface: #131d45; --surface-2: #182352;
  --text: #e7edff; --muted: #a3b4e3; --line: #283a78;
  --brand: #6ea8ff; --brand-hover: #93c0ff; --on-brand: #0a1129; --tint: #182352;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 5rem); }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-b);
  background-image: linear-gradient(to bottom right, var(--bg-a), var(--bg-b), var(--bg-c));
  background-attachment: fixed;
  line-height: 1.6;
}
a { color: inherit; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 80rem; margin: 0 auto; padding: 0 1rem; }
@media (min-width: 640px) { .wrap { padding: 0 1.5rem; } }
@media (min-width: 1024px) { .wrap { padding: 0 2rem; } }

/* header */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 2px solid color-mix(in srgb, var(--line) 60%, transparent);
  box-shadow: var(--shadow);
}
.bar { display: flex; align-items: center; justify-content: space-between; height: 4rem; }
.brand { display: flex; align-items: center; gap: .75rem; text-decoration: none; }
.logo {
  width: 3rem; height: 3rem; border-radius: .9rem; overflow: hidden; background: #fff;
  border: 2px solid var(--line); box-shadow: var(--shadow); transition: transform .2s;
  display: flex; align-items: center; justify-content: center; flex: none;
}
.brand:hover .logo { transform: scale(1.08); }
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand h1 {
  margin: 0; font-size: 1.25rem; font-weight: 800; line-height: 1.2; letter-spacing: -.01em;
  background: linear-gradient(to right, #1d4ed8, #4f46e5, #1d4ed8); -webkit-background-clip: text; background-clip: text; color: transparent;
}
:root[data-theme="dark"] .brand h1 { background: linear-gradient(to right, #8ab8ff, #a5b4fc, #8ab8ff); -webkit-background-clip: text; background-clip: text; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand h1 { background: linear-gradient(to right, #8ab8ff, #a5b4fc, #8ab8ff); -webkit-background-clip: text; background-clip: text; } }
.brand p { margin: -2px 0 0; font-size: .75rem; font-weight: 500; color: var(--brand); }
nav.desk { display: none; gap: .25rem; align-items: center; }
@media (min-width: 768px) { nav.desk { display: flex; } .burger { display: none !important; } }
.navbtn {
  display: inline-flex; align-items: center; gap: .5rem; padding: .55rem 1rem; border-radius: .6rem;
  font-weight: 700; font-size: .92rem; text-decoration: none; color: var(--brand); transition: background .2s, color .2s;
  border: 0; background: transparent; cursor: pointer;
}
.navbtn:hover { background: var(--tint); }
.navbtn.active { background: var(--brand); color: var(--on-brand); box-shadow: 0 4px 12px -4px rgba(29,78,216,.5); }
.navbtn.active:hover { background: var(--brand-hover); }
.ico { width: 1rem; height: 1rem; flex: none; }
.burger { width: 2.5rem; height: 2.5rem; padding: 0; justify-content: center; }
.burger .ico { width: 1.25rem; height: 1.25rem; }
.mnav { border-top: 1px solid var(--line); padding: 1rem 0; display: flex; flex-direction: column; gap: .5rem; }
.mnav .navbtn { width: 100%; justify-content: flex-start; }
@media (min-width: 768px) { .mnav { display: none; } }

/* hero */
.hero { padding: 3.5rem 0 2.5rem; display: grid; gap: 2.5rem; align-items: center; }
@media (min-width: 860px) { .hero { grid-template-columns: 1.25fr .75fr; padding: 5rem 0 3.5rem; } }
.hero h2 { font-size: clamp(2.2rem, 5.5vw, 3.8rem); line-height: 1.05; letter-spacing: -.03em; font-weight: 800; margin: 0 0 1rem; color: var(--primary); }
:root[data-theme="dark"] .hero h2 { color: #dbe6ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero h2 { color: #dbe6ff; } }
.hero p.lead { font-size: 1.15rem; color: var(--muted); max-width: 34rem; margin: 0 0 1.75rem; }
.ctas { display: flex; flex-wrap: wrap; gap: .75rem; }
.btn {
  display: inline-flex; align-items: center; gap: .55rem; padding: .8rem 1.4rem; border-radius: .8rem; font-weight: 700;
  text-decoration: none; border: 2px solid var(--brand); cursor: pointer; background: var(--brand); color: var(--on-brand); transition: background .2s, transform .15s;
}
.btn:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn.ghost { background: transparent; color: var(--brand); }
.btn.ghost:hover { background: var(--tint); }
.btn.small { padding: .5rem .9rem; font-size: .88rem; border-radius: .6rem; }
.btn.danger { background: transparent; color: #dc2626; border-color: #dc2626; }
.mascot {
  width: min(100%, 20rem); aspect-ratio: 1; margin-inline: auto; border-radius: 50%; overflow: hidden; background: #fff;
  border: 6px solid var(--light); box-shadow: 0 30px 60px -25px rgba(30,58,138,.55);
}
.mascot img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* sections */
section.block { padding: 2.5rem 0; }
h3.sec { font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 .35rem; font-weight: 800; }
p.sub { margin: 0 0 1.5rem; color: var(--muted); max-width: 40rem; }
.ways { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
.way { background: var(--surface); border: 2px solid var(--line); border-radius: 1rem; padding: 1.25rem 1.3rem; border-left: 6px solid var(--secondary); }
.way:nth-child(2) { border-left-color: var(--accent); }
.way:nth-child(3) { border-left-color: var(--primary-dark); }
.way:nth-child(4) { border-left-color: #0ea5e9; }
.way h4 { margin: 0 0 .3rem; font-size: 1.05rem; }
.way p { margin: 0; color: var(--muted); font-size: .95rem; }

/* opportunities */
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.5rem; }
.chip { padding: .45rem .95rem; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: .88rem; cursor: pointer; color: var(--brand); }
.chip:hover { background: var(--tint); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr)); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 1rem; padding: 1.3rem; display: flex; flex-direction: column; gap: .6rem; box-shadow: var(--shadow); }
.tag { align-self: flex-start; font-size: .78rem; font-weight: 700; padding: .2rem .65rem; border-radius: 999px; background: var(--light); color: var(--primary); }
:root[data-theme="dark"] .tag { background: #22337a; color: #cfe0ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag { background: #22337a; color: #cfe0ff; } }
.card h4 { margin: 0; font-size: 1.15rem; line-height: 1.25; }
.card .meta { margin: 0; font-size: .86rem; color: var(--muted); font-weight: 600; }
.card .desc { margin: 0; color: var(--muted); flex: 1; }
.card .btn { align-self: flex-start; }
.empty { padding: 2rem; border: 2px dashed var(--line); border-radius: 1rem; color: var(--muted); text-align: center; }

/* footer */
footer.foot {
  margin-top: 4rem; color: #fff; padding: 2rem 0; position: relative; overflow: hidden;
  background: linear-gradient(to bottom right, #1e3a8a, #312e81, #1e40af);
}
footer.foot .row { display: flex; flex-direction: column; gap: 1rem; align-items: center; justify-content: space-between; }
@media (min-width: 768px) { footer.foot .row { flex-direction: row; } }
footer.foot .brand-f { display: flex; align-items: center; gap: .75rem; }
footer.foot .logo { width: 2.5rem; height: 2.5rem; border-color: #93c5fd; }
footer.foot b { font-size: 1.1rem; display: block; }
footer.foot small { color: #bfdbfe; font-size: .88rem; display: block; }
footer.foot .copy { color: #93c5fd; font-size: .88rem; margin: 0; text-align: center; }
footer.foot a.ig { display: inline-flex; align-items: center; gap: .5rem; color: #fff; font-weight: 700; text-decoration: none; padding: .5rem .9rem; border: 2px solid #93c5fd; border-radius: .7rem; }
footer.foot a.ig:hover { background: rgba(255,255,255,.12); }
footer.foot button.linklike { background: none; border: 0; color: #bfdbfe; text-decoration: underline; cursor: pointer; padding: 0; font-size: .85rem; }

/* gate */
.gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 1.25rem;
  background: linear-gradient(to bottom right, #1e3a8a, #312e81, #1e40af); overflow-y: auto; }
.gate .panel { width: min(100%, 26rem); background: var(--surface); border-radius: 1.4rem; padding: 2rem 1.75rem; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6); text-align: center; }
.gate .mascot { width: 8.5rem; border-width: 4px; margin-bottom: 1.1rem; }
.gate h2 { margin: 0 0 .3rem; font-size: 1.6rem; letter-spacing: -.02em; }
.gate p { margin: 0 0 1.4rem; color: var(--muted); }
.gate form { display: flex; flex-direction: column; gap: .8rem; text-align: left; }
label.f { display: flex; flex-direction: column; gap: .3rem; font-weight: 700; font-size: .85rem; }
input[type=text], input[type=email], input[type=url], textarea, select {
  width: 100%; padding: .7rem .85rem; border-radius: .7rem; border: 2px solid var(--line); background: var(--surface); }
textarea { min-height: 5rem; resize: vertical; }
.gate .btn { justify-content: center; width: 100%; margin-top: .4rem; }

/* editing */
.editfab { position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 60; box-shadow: var(--shadow); }
.editbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: .8rem 1rem calc(.8rem + env(safe-area-inset-bottom, 0px));
  background: var(--primary); color: #fff; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: center; }
.editbar span { font-weight: 600; font-size: .92rem; }
.editbar .btn { background: #fff; color: var(--primary); border-color: #fff; }
.editbar .btn.ghost { background: transparent; color: #fff; border-color: #fff; }
body.is-editing { padding-bottom: 5rem; }
.epanel { background: var(--surface); border: 2px dashed var(--secondary); border-radius: 1rem; padding: 1.25rem; margin: 1.5rem 0; display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
.epanel h3 { grid-column: 1 / -1; margin: 0; font-size: 1.1rem; }
.epanel .wide { grid-column: 1 / -1; }
.card.editing { border-style: dashed; border-color: var(--secondary); }
.row2 { display: grid; gap: .6rem; grid-template-columns: 1fr 1fr; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ===== color refresh ===== */
:root {
  --c-blue: #3b82f6; --c-indigo: #6366f1; --c-teal: #14b8a6; --c-coral: #fb7185; --c-gold: #f59e0b; --c-violet: #a855f7;
  --mixbase: #0f1b3d; --grad: linear-gradient(135deg, #1d4ed8, #6366f1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mixbase: #ffffff; --grad: linear-gradient(135deg, #3b82f6, #8b5cf6); } }
:root[data-theme="dark"] { --mixbase: #ffffff; --grad: linear-gradient(135deg, #3b82f6, #8b5cf6); }
body {
  background-color: var(--bg-b);
  background-image:
    radial-gradient(40rem 28rem at 8% -4%, color-mix(in srgb, var(--c-blue) 22%, transparent), transparent 70%),
    radial-gradient(34rem 26rem at 96% 6%, color-mix(in srgb, var(--c-violet) 18%, transparent), transparent 70%),
    radial-gradient(36rem 28rem at 88% 70%, color-mix(in srgb, var(--c-teal) 16%, transparent), transparent 70%),
    radial-gradient(34rem 26rem at 4% 88%, color-mix(in srgb, var(--c-coral) 14%, transparent), transparent 70%);
  background-attachment: fixed;
}
header.top { border-bottom: 0; box-shadow: 0 1px 0 color-mix(in srgb, var(--line) 70%, transparent), 0 12px 30px -18px rgba(30,58,138,.35); }
.navbtn.active { background: var(--grad); }
.btn { background: var(--grad); border-color: transparent; color: #fff; }
.btn:hover { filter: brightness(1.08); background: var(--grad); border-color: transparent; }
.btn.ghost { background: transparent; color: var(--brand); border-color: var(--brand); }
.btn.ghost:hover { background: var(--tint); filter: none; }
.btn.danger { background: transparent; color: #dc2626; border-color: #dc2626; }
.editbar .btn { background: #fff; color: var(--primary); }
.editbar .btn.ghost { background: transparent; color: #fff; border-color: #fff; }
.hero h2 { background: linear-gradient(100deg, #1e3a8a 10%, #4f46e5 55%, #0d9488 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .08em; }
:root[data-theme="dark"] .hero h2 { background: linear-gradient(100deg, #bcd3ff 10%, #c4b5fd 55%, #5eead4 100%); -webkit-background-clip: text; background-clip: text; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero h2 { background: linear-gradient(100deg, #bcd3ff 10%, #c4b5fd 55%, #5eead4 100%); -webkit-background-clip: text; background-clip: text; } }
.mascot-wrap { position: relative; width: min(100%, 20rem); margin-inline: auto; }
.mascot-wrap::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: var(--grad); }
.mascot-wrap::after { content: ""; position: absolute; width: 4.2rem; height: 4.2rem; right: -1.2rem; bottom: 1.2rem; border-radius: 50%; background: var(--c-gold); border: 5px solid var(--bg-b); }
.mascot-wrap .mascot { position: relative; width: 100%; border: 6px solid var(--surface); box-shadow: none; z-index: 1; }
.ways .way { border: 2px solid transparent; border-left-width: 2px; }
.way:nth-child(1) { background: color-mix(in srgb, var(--c-blue) 14%, var(--surface)); border-color: color-mix(in srgb, var(--c-blue) 40%, transparent); }
.way:nth-child(2) { background: color-mix(in srgb, var(--c-violet) 14%, var(--surface)); border-color: color-mix(in srgb, var(--c-violet) 40%, transparent); }
.way:nth-child(3) { background: color-mix(in srgb, var(--c-teal) 16%, var(--surface)); border-color: color-mix(in srgb, var(--c-teal) 45%, transparent); }
.way:nth-child(4) { background: color-mix(in srgb, var(--c-coral) 15%, var(--surface)); border-color: color-mix(in srgb, var(--c-coral) 45%, transparent); }
.way:nth-child(n+5) { background: color-mix(in srgb, var(--c-gold) 16%, var(--surface)); border-color: color-mix(in srgb, var(--c-gold) 45%, transparent); }
.way h4 { font-size: 1.1rem; }
.cc0 { --cc: var(--c-blue); } .cc1 { --cc: var(--c-violet); } .cc2 { --cc: var(--c-teal); }
.cc3 { --cc: var(--c-coral); } .cc4 { --cc: var(--c-gold); } .cc5 { --cc: var(--c-indigo); }
.card[class*="cc"] { border-color: color-mix(in srgb, var(--cc) 35%, var(--line)); border-top: 6px solid var(--cc); }
.card[class*="cc"] .tag { background: color-mix(in srgb, var(--cc) 20%, var(--surface)) !important; color: color-mix(in srgb, var(--cc) 62%, var(--mixbase)) !important; }
.card.editing { border-top-width: 2px; }
.chip { border-color: color-mix(in srgb, var(--c-indigo) 30%, var(--line)); }
.chip[aria-pressed="true"] { background: var(--grad); border-color: transparent; color: #fff; }
h3.gh { display: inline-flex; align-items: center; gap: .6rem; padding: .35rem 1rem .35rem .8rem; border-radius: 999px;
  background: color-mix(in srgb, var(--cc) 18%, var(--surface)); color: color-mix(in srgb, var(--cc) 62%, var(--mixbase)); font-size: 1.15rem; }
h3.gh::before { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: var(--cc); }
footer.foot { background: linear-gradient(120deg, #1e3a8a, #4338ca 55%, #0f766e); }
.gate { background: radial-gradient(40rem 30rem at 15% 10%, #6366f1aa, transparent 70%), radial-gradient(34rem 28rem at 90% 90%, #14b8a699, transparent 70%), linear-gradient(135deg, #1e3a8a, #312e81); }
.gate .mascot { border-color: var(--surface); box-shadow: 0 0 0 5px var(--c-gold); }
</style>
</head>

  function hashN(str) { var h = 0; str = String(str || ""); for (var k = 0; k < str.length; k++) h = (h * 31 + str.charCodeAt(k)) >>> 0; return h % 6; }
  function icon(n, cls) { return '<svg class="' + (cls || "ico") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + "</svg>"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function cur() { return editing ? draft : data; }
  function route() { return (location.hash || "#/").replace("#", "") || "/"; }

  function header(d, page) {
    var items = [["Home", "#/", "home", page === "home"], ["Opportunities", "#/opportunities", "brief", page === "opp"], ["Leaders", "#/leaders", "users", page === "leaders"]];
    var links = items.map(function (i) { return '<a class="navbtn' + (i[3] ? " active" : "") + '" href="' + i[1] + '">' + icon(i[2]) + i[0] + "</a>"; }).join("");
    return '<header class="top"><div class="wrap"><div class="bar">' +
      '<a class="brand" href="#/"><div class="logo"><img src="' + LOGO + '" alt="Discover Medicine logo"></div><div><h1>' + esc(d.site.title) + '</h1><p>' + esc(d.site.tagline) + "</p></div></a>" +
      '<nav class="desk" aria-label="Main">' + links + "</nav>" +
      '<button class="navbtn burger" id="burger" aria-label="' + (menuOpen ? "Close menu" : "Open menu") + '" aria-expanded="' + menuOpen + '">' + icon(menuOpen ? "x" : "menu") + "</button>" +
      "</div>" + (menuOpen ? '<div class="mnav">' + links + "</div>" : "") + "</div></header>";
  }

  function igBtn(d, cls) {
    var u = safeUrl(d.site.instagramUrl);
    return u ? '<a class="' + cls + '" href="' + esc(u) + '" target="_blank" rel="noopener">' + icon("ig") + esc(d.site.instagramLabel) + "</a>" : "";
  }

  function field(label, path, value, opts) {
    opts = opts || {};
    var input = opts.area
      ? '<textarea data-path="' + path + '">' + esc(value) + "</textarea>"
      : '<input type="' + (opts.type || "text") + '" data-path="' + path + '" value="' + esc(value) + '">';
    return '<label class="f' + (opts.wide ? " wide" : "") + '">' + esc(label) + input + "</label>";
  }

  function settingsPanel(d) {
    var s = d.site;
    var h = '<div class="epanel"><h3>Edit site text</h3>' +
      field("Club name", "site.title", s.title) + field("Tagline under the name", "site.tagline", s.tagline) +
      field("Homepage headline", "site.heroTitle", s.heroTitle, { wide: true }) +
      field("Homepage intro", "site.heroText", s.heroText, { area: true, wide: true }) +
      field("Instagram link (full https:// address)", "site.instagramUrl", s.instagramUrl, { type: "url", wide: true }) +
      field("Instagram button text", "site.instagramLabel", s.instagramLabel) +
      field("Footer tagline", "site.footerTagline", s.footerTagline) +
      field("Copyright line", "site.copyright", s.copyright, { wide: true }) +
      '<h3>"Ways to get involved" boxes</h3>';
    d.ways.forEach(function (w, i) {
      h += '<div class="wide row2">' + field("Box " + (i + 1) + " title", "ways." + i + ".title", w.title) + field("Box " + (i + 1) + " text", "ways." + i + ".text", w.text) + "</div>";
    });
    return h + "</div>";
  }

  function homePage(d) {
    var ways = d.ways.map(function (w) { return '<div class="way"><h4>' + esc(w.title) + "</h4><p>" + esc(w.text) + "</p></div>"; }).join("");
    var latest = d.items.slice(0, 3).map(function (it, i) { return oppCard(it, i, false); }).join("");
    return '<div class="wrap">' + (editing ? settingsPanel(d) : "") +
      '<div class="hero"><div><h2>' + esc(d.site.heroTitle) + '</h2><p class="lead">' + esc(d.site.heroText) + '</p><div class="ctas">' +
      '<a class="btn" href="#/opportunities">See opportunities ' + icon("arrow") + "</a>" + igBtn(d, "btn ghost") + "</div></div>" +
      '<div class="mascot-wrap"><div class="mascot"><img src="' + LOGO + '" alt="Bulldog in a white coat with a stethoscope"></div></div></div>' +
      '<section class="block"><h3 class="sec">Ways to get involved</h3><p class="sub">Pick what fits your schedule and goals.</p><div class="ways">' + ways + "</div></section>" +
      '<section class="block"><h3 class="sec">Newest opportunities</h3><p class="sub">A few to start with. The full list is on the Opportunities page.</p><div class="grid">' + (latest || '<div class="empty">No opportunities yet.</div>') + "</div></section></div>";
  }

  function oppCard(it, i, edit) {
    if (edit) {
      return '<div class="card editing">' +
        field("Title", "items." + i + ".title", it.title) +
        '<div class="row2">' + field("Category", "items." + i + ".category", it.category) + field("When", "items." + i + ".when", it.when) + "</div>" +
        field("Organization", "items." + i + ".org", it.org) +
        field("Description", "items." + i + ".text", it.text, { area: true }) +
        field("Sign-up or info link (optional)", "items." + i + ".link", it.link, { type: "url" }) +
        '<button class="btn danger small" data-del="' + i + '" type="button">Delete this opportunity</button></div>';
    }
    var u = safeUrl(it.link);
    return '<article class="card cc' + hashN(it.category) + '"><span class="tag">' + esc(it.category) + "</span><h4>" + esc(it.title) + "</h4>" +
      '<p class="meta">' + esc([it.org, it.when].filter(Boolean).join(" | ")) + "</p><p class=\"desc\">" + esc(it.text) + "</p>" +
      (u ? '<a class="btn small" href="' + esc(u) + '" target="_blank" rel="noopener">Sign up or learn more ' + icon("arrow") + "</a>" : "") + "</article>";
  }

  function oppPage(d) {
    var cats = ["All"];
    d.items.forEach(function (it) { if (it.category && cats.indexOf(it.category) < 0) cats.push(it.category); });
    if (cats.indexOf(filter) < 0) filter = "All";
    var chips = cats.map(function (c) { return '<button class="chip" data-filter="' + esc(c) + '" aria-pressed="' + (c === filter) + '">' + esc(c) + "</button>"; }).join("");
    var cards = d.items.map(function (it, i) { return { it: it, i: i }; })
      .filter(function (x) { return editing || filter === "All" || x.it.category === filter; })
      .map(function (x) { return oppCard(x.it, x.i, editing); }).join("");
    return '<div class="wrap" style="padding-top:2.5rem"><h2 class="sec" style="font-size:2rem;margin:0 0 .4rem;letter-spacing:-.03em">Opportunities</h2>' +
      '<p class="sub">Find something to join, then sign up through the link on the card.</p>' +
      (editing ? '<div style="margin-bottom:1rem"><button class="btn small" id="addopp" type="button">Add an opportunity</button></div>' : '<div class="chips" role="group" aria-label="Filter by category">' + chips + "</div>") +
      '<div class="grid">' + (cards || '<div class="empty">Nothing in this category yet. Check back soon.</div>') + "</div></div>";
  }

  function leaderCard(l, g, i, edit) {
    var base = "leaderGroups." + g + ".leaders." + i;
    if (edit) {
      return '<div class="card editing">' +
        '<div class="row2">' + field("Name", base + ".name", l.name) + field("Role", base + ".role", l.role) + "</div>" +
        '<div class="row2">' + field("Email", base + ".email", l.email, { type: "email" }) + field("Phone (optional)", base + ".phone", l.phone) + "</div>" +
        field("Short note (what to ask them about)", base + ".text", l.text, { area: true }) +
        '<button class="btn danger small" data-delleader="' + g + "-" + i + '" type="button">Delete this leader</button></div>';
    }

  }

  function editUI() {
    if (editing) {
      return '<div class="editbar"><span id="estatus">Editing. Changes go live when you publish.</span>' +
        '<button class="btn small" id="savebtn" type="button">Save and publish</button><button class="btn small ghost" id="cancelbtn" type="button">Discard changes</button></div>';
    }
    return canEdit ? '<button class="btn editfab" id="editbtn" type="button">' + icon("edit") + "Edit site</button>" : "";
  }

  function render() {
    var d = cur(), r = route(), page = r.indexOf("/opportunities") === 0 ? "opp" : r.indexOf("/leaders") === 0 ? "leaders" : "home";
    document.title = d.site.title;
    document.body.classList.toggle("is-editing", editing);
    root.innerHTML = header(d, page) + "<main>" + (page === "opp" ? oppPage(d) : page === "leaders" ? leadersPage(d) : homePage(d)) + "</main>" + footer(d) + editUI() + (member ? "" : gate(d));
  }

  function setPath(obj, path, val) {
    var p = path.split("."), o = obj;
    for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = val;
  }

  root.addEventListener("input", function (e) {
    var p = e.target.getAttribute && e.target.getAttribute("data-path");
    if (p && editing) setPath(draft, p, e.target.value);
  });

  root.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    if (t.id === "burger") { menuOpen = !menuOpen; render(); }
    else if (t.hasAttribute("data-filter")) { filter = t.getAttribute("data-filter"); render(); }
    else if (t.id === "signout") { member = null; try { localStorage.removeItem("dm_member"); } catch (x) {} render(); }
    else if (t.id === "editbtn") { draft = JSON.parse(JSON.stringify(data)); editing = true; render(); }
    else if (t.id === "cancelbtn") { editing = false; draft = null; render(); }
    else if (t.id === "addopp") { draft.items.unshift({ title: "New opportunity", category: "Volunteering", org: "", when: "", link: "", text: "Describe what people will do." }); render(); }
    else if (t.id === "addgroup") { draft.leaderGroups = draft.leaderGroups || []; draft.leaderGroups.push({ title: "New section", leaders: [{ name: "New leader", role: "Role", email: "", phone: "", text: "" }] }); render(); }
    else if (t.hasAttribute("data-addleader")) { draft.leaderGroups[Number(t.getAttribute("data-addleader"))].leaders.push({ name: "New leader", role: "Role", email: "", phone: "", text: "" }); render(); }
    else if (t.hasAttribute("data-delgroup")) {
      var gi = Number(t.getAttribute("data-delgroup"));
      if (window.confirm("Delete the section \"" + draft.leaderGroups[gi].title + "\" and everyone in it?")) { draft.leaderGroups.splice(gi, 1); render(); }
    }
    else if (t.hasAttribute("data-delleader")) {
      var ij = t.getAttribute("data-delleader").split("-"), L = draft.leaderGroups[Number(ij[0])].leaders;
      if (window.confirm("Delete \"" + L[Number(ij[1])].name + "\"?")) { L.splice(Number(ij[1]), 1); render(); }
    }
    else if (t.hasAttribute("data-del")) {
      var i = Number(t.getAttribute("data-del"));
      if (window.confirm("Delete \"" + draft.items[i].title + "\"?")) { draft.items.splice(i, 1); render(); }
    }
    else if (t.id === "savebtn") save();
  });

  root.addEventListener("submit", function (e) {
    if (e.target.id !== "gateform") return;
    e.preventDefault();
    var f = new FormData(e.target);
    member = { name: String(f.get("name")).trim(), email: String(f.get("email")).trim() };
    try { localStorage.setItem("dm_member", JSON.stringify(member)); } catch (x) {}
    render();
  });

  window.addEventListener("hashchange", function () { menuOpen = false; render(); window.scrollTo(0, 0); });

  function buildHtml(d) {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector("#root").innerHTML = "";
    clone.querySelector("#site-data").textContent = JSON.stringify(d, null, 2).replace(/</g, "\\u003c");
    clone.querySelector("body").removeAttribute("class");
    return "<!doctype html>\n" + clone.outerHTML;
  }

  async function save() {
    var st = document.getElementById("estatus"), btn = document.getElementById("savebtn");
    if (!artifactNs) { if (st) st.textContent = "Publishing isn't available in this view."; return; }
    if (st) st.textContent = "Publishing...";
    if (btn) btn.disabled = true;
    try { await artifactNs.publish(buildHtml(draft)); }
    catch (err) {
      if (btn) btn.disabled = false;
      if (st) st.textContent = (err && err.code === "conflict") ? "Someone else published first. Reloading the latest version." : "Couldn't publish. Try again in a moment.";
    }
  }

  render();

  if (window.claude && window.claude.use) {
    window.claude.use("user").then(function (u) {
      if (u && (u.canEdit() || u.isOwner())) {
        return window.claude.use("artifact").then(function (a) { artifactNs = a; canEdit = !!a; if (canEdit && !editing) render(); });
      }
    }).catch(function () {});
  }
})();
</script>


</body></html>
